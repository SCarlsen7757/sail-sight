name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  build-api:
    name: Build API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build API
        uses: ./.github/actions/build-api

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build Web
        uses: ./.github/actions/build-web

  docker-api:
    name: Docker Build — API
    uses: ./.github/workflows/_docker-api.yml
    with:
      push: false

  docker-web:
    name: Docker Build — Web
    uses: ./.github/workflows/_docker-web.yml
    with:
      push: false
