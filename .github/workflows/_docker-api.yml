name: Docker — Build/Push API

on:
  workflow_call:
    inputs:
      push:
        description: Whether to push the image to the registry
        type: boolean
        required: true

jobs:
  docker-api:
    name: Docker ${{ inputs.push && 'Build & Push' || 'Build' }} — API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GitHub Container Registry
        if: inputs.push
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # All image tags are derived from the triggering ref, so callers don't
      # pass a version. `latest=auto` applies `latest` only on a semver tag
      # push and never on a prerelease, so a merge to main cannot move
      # `latest` off the newest release.
      #
      #   tag v1.2.3  -> 1.2.3, 1.2, 1, latest
      #   push main   -> main, sha-a1b2c3d
      #   PR #42      -> pr-42 (built, never pushed)
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/sail-sight-api
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=branch
            type=ref,event=pr,prefix=pr-
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: SailSight.Api/Dockerfile
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
