services:
  db:
    image: timescale/timescaledb-ha:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sailsight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sailsight}
      POSTGRES_DB: ${POSTGRES_DB:-sailsight}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sailsight}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: ${DOCKER_REGISTRY-}sailsightapi
    build:
      context: .
      dockerfile: SailSight.Api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: >-
        Host=db;Port=5432;Database=${POSTGRES_DB:-sailsight};Username=${POSTGRES_USER:-sailsight};Password=${POSTGRES_PASSWORD:-sailsight}
      Auth__Mode: MultiUser
      # Bootstrap admin on first start. Change these before deploying!
      # If Password is empty, a one-time setup URL is logged on startup.
      Auth__Admin__Email: ${AUTH_ADMIN_EMAIL:-admin@test.local}
      Auth__Admin__Password: ${AUTH_ADMIN_PASSWORD:-password1234!}
      Cors__AllowedOrigins__0: http://localhost:8081
      Web__PublicBaseUrl: http://localhost:8081
    ports:
      - "8080:8080"

  web:
    image: ${DOCKER_REGISTRY-}sailsightweb
    build:
      context: SailSight.Web
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_BASE_URL: http://api:8080
    ports:
      - "8081:3000"

volumes:
  database:
