# SailSight — self-hosting with pre-built images from GitHub Container Registry.
#
# Unlike docker-compose.yml (which builds from source for development), this
# file pulls published images and needs no source checkout — just this file.
#
#   curl -O https://raw.githubusercontent.com/SCarlsen7757/sail-sight/main/docker-compose.ghcr.yml
#   printf 'POSTGRES_PASSWORD=%s\n' "$(openssl rand -base64 24)" > .env
#   docker compose -f docker-compose.ghcr.yml up -d
#
# Then open http://localhost:8081. On first start the API logs a one-time setup
# URL for the bootstrap admin — grab it with:
#
#   docker compose -f docker-compose.ghcr.yml logs api | grep -i setup
#
# To upgrade:  docker compose -f docker-compose.ghcr.yml pull && ... up -d
#
# ---------------------------------------------------------------------------
# .env reference — POSTGRES_PASSWORD is required, everything else is optional:
#
#   POSTGRES_PASSWORD=<required, no default>
#   SAILSIGHT_TAG=latest          # or 1.2.3 / 1.2 / 1 to pin, or main for dev builds
#   PUBLIC_BASE_URL=http://localhost:8081
#   AUTH_ADMIN_EMAIL=admin@example.com
#   AUTH_ADMIN_PASSWORD=          # leave empty to use the logged setup URL
#   RACE_SUMMARY_API_KEY=         # optional, enables AI race summaries
# ---------------------------------------------------------------------------

# Fixed project name so the stack isn't named after whatever directory you
# happen to put this file in.
name: sailsight

services:
  db:
    image: timescale/timescaledb-ha:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sailsight}
      # Deliberately has no default — a shipped default password would end up
      # in real deployments. Compose fails fast until you set it.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env, e.g. openssl rand -base64 24}
      POSTGRES_DB: ${POSTGRES_DB:-sailsight}
    volumes:
      # Holds telemetry *and* the ASP.NET Data Protection keys (persisted to
      # the database, not the filesystem). Losing this volume invalidates every
      # auth cookie — back it up, don't just recreate it.
      - database:/var/lib/postgresql/data
    # Not published to the host. Add a ports mapping only if you need external
    # DB tooling, and bind it to 127.0.0.1 if you do.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sailsight}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: ghcr.io/scarlsen7757/sail-sight-api:${SAILSIGHT_TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: >-
        Host=db;Port=5432;Database=${POSTGRES_DB:-sailsight};Username=${POSTGRES_USER:-sailsight};Password=${POSTGRES_PASSWORD}

      # MultiUser = admin-managed accounts. Set SingleUser to skip auth entirely
      # (the admin bootstrap below is then ignored).
      Auth__Mode: ${AUTH_MODE:-MultiUser}

      # Bootstrap admin, created once on first start. Leaving the password empty
      # is the safer default: the API logs a one-time setup URL instead, so no
      # credential is ever written to .env. Minimum 12 characters if you set one.
      Auth__Admin__Email: ${AUTH_ADMIN_EMAIL:-admin@example.com}
      Auth__Admin__Password: ${AUTH_ADMIN_PASSWORD:-}

      # Must match the URL you actually reach the web UI on, including port.
      # Cookies and invitation links are wrong if this is wrong.
      Cors__AllowedOrigins__0: ${PUBLIC_BASE_URL:-http://localhost:8081}
      Web__PublicBaseUrl: ${PUBLIC_BASE_URL:-http://localhost:8081}

      # Optional — enables AI race summaries. Any OpenAI-compatible endpoint.
      RaceSummary__ApiKey: ${RACE_SUMMARY_API_KEY:-}
      RaceSummary__Model: ${RACE_SUMMARY_MODEL:-gpt-4o-mini}
    ports:
      # Bound to loopback: the web UI reaches the API over the internal compose
      # network, so this is only for curl uploads and the Scalar docs. Change to
      # "8080:8080" only if you deliberately want the API on your network.
      - "127.0.0.1:8080:8080"

  web:
    image: ghcr.io/scarlsen7757/sail-sight-web:${SAILSIGHT_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      # Internal service address — not the public URL. The browser talks to the
      # API through this container's same-origin /api/* proxy.
      API_BASE_URL: http://api:8080
    ports:
      - "${WEB_PORT:-8081}:3000"

volumes:
  database:
